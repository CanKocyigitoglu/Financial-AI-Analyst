name: Price alerts

on:
  schedule: # ABD borsası açıkken (09:30-16:00 New York) 15 dakikada bir
    - cron: "30,45 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "*/15 10-15 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch: # GitHub'da "Run workflow" ile elle çalıştırmak için

concurrency:
  group: price-alerts # iki kontrol aynı anda çalışıp aynı uyarıyı iki kez göndermesin

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Bugün hangi uyarıların gönderildiği önceki çalışmadan alınır
      - uses: actions/cache/restore@v6
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - run: python price_alerts.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
