name: Price alerts

on:
  # Zamanlama cron-job.org'da: ABD borsası açıkken (09:30-15:45 New York) 15 dakikada bir.
  workflow_dispatch: # cron-job.org tetikler; GitHub'da "Run workflow" ile elle de çalışır

concurrency:
  group: price-alerts # iki kontrol aynı anda çalışıp aynı uyarıyı iki kez göndermesin

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python price_alerts.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
