name: Daily stock report

on:
  # Zamanlama cron-job.org'da (hafta içi 15:05 Londra); GitHub'ın kendi zamanlayıcısı güvenilir değil.
  workflow_dispatch: # cron-job.org tetikler; GitHub'da "Run workflow" ile elle de çalışır

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python daily_report.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
