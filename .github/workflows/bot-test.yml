name: Bot test

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_WATCH_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ İzleme listesi botu: yeni token GitHub'da çalışıyor."
        env:
          TELEGRAM_WATCH_TOKEN: ${{ secrets.TELEGRAM_WATCH_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
