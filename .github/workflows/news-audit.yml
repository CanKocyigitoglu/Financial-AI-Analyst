name: News audit

on:
  # Zamanlama cron-job.org'da (cumartesi 09:07 Londra).
  workflow_dispatch: # cron-job.org tetikler; GitHub'da "Run workflow" ile elle de çalışır

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-news.txt
      - run: pip install -r requirements-news.txt
      - run: python news_audit.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
