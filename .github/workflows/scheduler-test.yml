name: Scheduler test

on:
  schedule:
    - cron: "15 21 * * *" # 21:15 deneme mesajı
      timezone: "Europe/London"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Deneme mesajı (GitHub, tetikleyici: ${{ github.event_name }}). Planlanan 21:15, çalıştığı an $(TZ=Europe/London date +%H:%M:%S) Londra saati."
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
