name: News pipeline

on:
  # Zamanlama cron-job.org'da: hafta içi 06:10-20:40 New York 30 dk'da bir, hafta sonu 3 saatte bir.
  workflow_dispatch: # cron-job.org tetikler; GitHub'da "Run workflow" ile elle de çalışır

concurrency:
  group: news-pipeline # iki çalışma aynı haberi aynı anda işlemesin

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-news.txt
      - run: pip install -r requirements-news.txt
      - run: python news_pipeline.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
